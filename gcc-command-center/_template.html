<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GCC e-invoice command center</title>
<style>
:root{
  --chrome-bg:#0E1420; --chrome-text:#E6EAF2; --chrome-muted:#8A97A8; --chrome-line:#2A374C;
  --surface:#F6F7F9; --card:#FFFFFF; --border:#E3E7EE; --border-strong:#D3D9E2;
  --tp:#16202E; --ts:#5B6B7F; --tm:#8A97A8;
  --green:#1E9E6A; --amber:#D98E04; --red:#C6373C;
  --navy:#22304A; --hover:#F0F4F9;
  --govern:#6C5AC2; --risk:#D98E04; --compliance:#1E9E6A;
  --c-uae:#4A90A4; --c-ksa:#B87333; --c-omn:#5A6E8C; --c-up:#7A5E8A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--surface);color:var(--tp);font-size:13px;line-height:1.5}
#app{max-width:1200px;margin:0 auto}

/* chrome */
.chrome{background:var(--chrome-bg);color:var(--chrome-text);padding:14px 32px 0}
.chrome-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;font-size:10.5px;font-weight:400;color:var(--chrome-muted);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
.chrome-controls{margin-left:auto;display:flex;align-items:center;gap:8px}
.scope-select,.persona-pill{background:#1A2333;border:1px solid var(--chrome-line);padding:6px 12px;border-radius:20px;font:500 11px Inter,system-ui;color:var(--chrome-text);cursor:pointer}
.scope-select{padding-right:26px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238A97A8' stroke-width='1.2' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;-webkit-appearance:none;appearance:none}
.tabbar{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--chrome-line);overflow-x:auto}
.tab{background:transparent;border:none;color:#9FB0C6;padding:10px 16px;font:500 12.5px Inter,system-ui;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:#E6EAF2}
.tab.on{color:#fff;border-bottom-color:#fff}

/* briefing */
.briefing{background:var(--navy);color:#EAF0F8;padding:24px 32px;border-bottom:1px solid #1A2438}
.briefing-label{font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#8FA3C0;margin-bottom:12px}
.briefing-lead{font-size:16px;line-height:1.55;color:#F5F8FC;font-weight:400;margin:0 0 14px;max-width:860px}
.briefing-lead b{font-weight:600;color:#fff}
.briefing-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.briefing-list li{font-size:13px;color:#C9D6E8;padding-left:14px;position:relative}
.briefing-list li::before{content:"·";position:absolute;left:4px;color:#5F7085;font-weight:700;font-size:18px;line-height:1}

.tab-intro{padding:20px 32px;background:#fff;border-bottom:1px solid var(--border)}
.tab-intro-lead{font-size:14px;color:var(--tp);font-weight:500;margin:0 0 4px;max-width:860px}
.tab-intro-sub{font-size:12.5px;color:var(--ts);margin:0;max-width:860px}

.main{padding:28px 32px 40px}

/* country row */
.country-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px}
.country-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .12s}
.country-card:hover{border-color:var(--border-strong)}
.cc-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.cc-name{font-size:13.5px;font-weight:600;color:var(--tp)}
.cc-code{font-size:10px;color:var(--tm);letter-spacing:.06em;text-transform:uppercase}
.cc-auth{font-size:11px;color:var(--tm);margin-bottom:10px}
.cc-rag{display:flex;gap:14px;margin:8px 0 10px}
.cc-rag-item{display:flex;align-items:center;gap:5px}
.cc-rag-letter{font-size:9.5px;font-weight:500;color:var(--tm);letter-spacing:.04em}
.cc-rag-dot{width:7px;height:7px;border-radius:50%}
.cc-rag-dot.g{background:var(--green)} .cc-rag-dot.a{background:var(--amber)} .cc-rag-dot.r{background:var(--red)}
.cc-status{font-size:12px;color:var(--ts);line-height:1.4}
.cc-metrics{display:flex;gap:18px;margin-top:12px;padding-top:12px;border-top:1px solid var(--surface)}
.cc-metric{display:flex;flex-direction:column}
.cc-metric b{font-size:15px;font-weight:600;color:var(--tp);font-variant-numeric:tabular-nums}
.cc-metric span{font-size:10px;color:var(--tm);letter-spacing:.04em;text-transform:uppercase}

/* section */
.section{margin-bottom:40px}
.section-eyebrow{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);margin-bottom:10px}
.section-mark{width:8px;height:8px;border-radius:2px;display:inline-block}
.section-mark.govern{background:var(--govern)} .section-mark.risk{background:var(--risk)} .section-mark.compliance{background:var(--compliance)}
.section-headline{font-size:19px;font-weight:500;color:var(--tp);line-height:1.4;margin:0 0 8px;max-width:860px;letter-spacing:-.005em}
.section-sub{font-size:13px;color:var(--ts);margin:0 0 20px;max-width:820px;line-height:1.5}

/* grid */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.card-grid{grid-template-columns:1fr} .country-row{grid-template-columns:1fr}}
.span-2{grid-column:span 2}
@media (max-width:900px){.span-2{grid-column:span 1}}

.mcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:border-color .12s}
.mcard:hover{border-color:var(--border-strong)}
.mcard-label{font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--tm)}
.mcard-value{font-size:18px;font-weight:600;color:var(--tp);font-variant-numeric:tabular-nums;line-height:1.3}
.mcard-note{font-size:12.5px;color:var(--ts);margin-top:auto;line-height:1.5}
.mcard.tall{min-height:280px} .mcard.short{min-height:132px}
.mcard.gap{border-style:dashed;border-color:var(--border-strong);background:transparent}
.mcard.gap .mcard-value{font-size:14.5px;font-weight:400;font-style:italic;color:var(--tm)}
.mcard-gap-tag{display:inline-block;font-size:9.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--tm);background:#EDF0F4;padding:2px 8px;border-radius:10px;align-self:flex-start}

.chart-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.chart-title{font-size:14px;font-weight:600;color:var(--tp);margin:0}
.chart-sub{font-size:11.5px;color:var(--tm);margin:2px 0 0}
.chart-headline{font-size:14px;font-weight:500;color:var(--tp);margin:6px 0 12px;line-height:1.4}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ts)}
.chart-legend-swatch{display:inline-block;width:10px;height:2.5px;border-radius:1px;margin-right:5px;vertical-align:middle}
.chart-svg{display:block;width:100%;height:auto}
.chart-line{fill:none;stroke-width:1.75}
.chart-axis-label{font-family:Inter,system-ui;font-size:10.5px;fill:var(--tm)}
.chart-grid-line{stroke:var(--border);stroke-width:.5}

/* ranking bars */
.rank-list{margin:12px 0 0;display:grid;gap:12px}
.rank-item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;font-size:12px}
.rank-label{color:var(--tp);font-weight:600}
.rank-bar-wrap{height:14px;background:var(--surface);border-radius:7px;overflow:hidden}
.rank-bar-fill{height:100%;border-radius:7px}
.rank-value{text-align:right;font-variant-numeric:tabular-nums;color:var(--tp);font-weight:600;min-width:52px}
.rank-sub{font-size:10.5px;color:var(--tm);font-weight:400}

/* recon matrix */
.heatmap{width:100%;border-collapse:collapse;margin-top:6px}
.heatmap th,.heatmap td{padding:5px 4px;text-align:center;font-size:11px}
.heatmap th{color:var(--tm);font-weight:500;letter-spacing:.03em;text-transform:uppercase;font-size:9.5px}
.heatmap th.row{text-align:left;padding-right:10px}
.heatmap td.rowlabel{text-align:left;color:var(--tp);font-weight:600;padding-right:10px;font-size:12px}
.heat-cell{display:inline-block;width:100%;padding:8px 0;border-radius:4px;color:var(--tp);font-weight:500;font-variant-numeric:tabular-nums}

/* stat rows */
.stat-list{display:grid;gap:2px;margin-top:8px}
.stat-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--surface);font-size:12.5px}
.stat-row:last-child{border-bottom:none}
.stat-row-label{color:var(--ts)}
.stat-row-label b{color:var(--tp);font-weight:500}
.stat-row-value{font-weight:600;color:var(--tp);font-variant-numeric:tabular-nums;text-align:right}
.stat-badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500;margin-left:6px}
.stat-badge.g{background:#E3F4EC;color:var(--green)} .stat-badge.a{background:#FBF0DA;color:#9A6503} .stat-badge.r{background:#F9E4E5;color:var(--red)}

/* worklist table */
.wl-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.wl-table th{text-align:left;font-size:9.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--tm);padding:6px 8px;border-bottom:1px solid var(--border)}
.wl-table th.num,.wl-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.wl-table td{padding:9px 8px;border-bottom:1px solid var(--surface);color:var(--ts);vertical-align:top}
.wl-table td b{color:var(--tp);font-weight:500}
.wl-doc{font-variant-numeric:tabular-nums;color:var(--tp);font-weight:500}
.sev{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sev.l1{background:var(--green)} .sev.l2{background:var(--amber)} .sev.l3{background:var(--red)}

/* readiness */
.ready-track{display:grid;gap:9px;margin-top:8px}
.ready-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:12px;color:var(--ts)}
.ready-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.ready-dot.done{background:var(--green)} .ready-dot.prog{background:var(--amber)} .ready-dot.mon{background:var(--govern)} .ready-dot.no{background:var(--border-strong)}
.ready-pct-wrap{height:8px;background:var(--surface);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.ready-pct-fill{height:100%;border-radius:5px;background:var(--govern)}

/* coverage matrix */
.cov-matrix{width:100%;border-collapse:collapse;margin-top:8px}
.cov-matrix th{font-size:9.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--tm);text-align:center;padding:8px 6px;border-bottom:1px solid var(--border)}
.cov-matrix th.row{text-align:left}
.cov-matrix td{padding:10px 6px;text-align:center;border-bottom:1px solid var(--surface);font-size:12px}
.cov-matrix td.rowlabel{text-align:left;color:var(--tp);font-weight:600}
.cov-matrix td.rowlabel small{display:block;font-size:10px;color:var(--tm);font-weight:400;margin-top:1px}
.cov-symbol{display:inline-block;width:12px;height:12px;border-radius:50%}
.cov-symbol.live{background:var(--compliance)} .cov-symbol.partial{background:var(--amber)} .cov-symbol.plan{background:transparent;border:1px dashed var(--border-strong)}

/* pills / meta */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
@media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.kpi-label{font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--tm)}
.kpi-value{font-size:22px;font-weight:600;color:var(--tp);font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.1}
.kpi-note{font-size:11.5px;color:var(--ts);margin-top:5px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ts);cursor:pointer;margin-bottom:16px;font-weight:500}
.back-link:hover{color:var(--tp)}

.legend{margin-top:36px;padding:20px 0;border-top:1px solid var(--border);font-size:11.5px;color:var(--tm);display:flex;gap:24px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-swatch{width:9px;height:9px;border-radius:2px}
.legend-dashed{width:16px;height:10px;border:1px dashed var(--tm);border-radius:2px;background:transparent}
.footnote{font-size:11px;color:var(--tm);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div id="app">
  <div id="chrome"></div>
  <div id="briefing"></div>
  <div class="main" id="main"></div>
</div>

<script>
'use strict';
const DATA = /*__DATA__*/;

const CCOL = {UAE:'#4A90A4', KSA:'#B87333', OMN:'#5A6E8C'};
const LIVE = ['UAE','KSA','OMN'];
const S = {scope:'portfolio', tab:'overview'};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s);}
function money(cur, v){return cur + ' ' + Math.round(v).toLocaleString('en-US');}
function pct(v){return v.toFixed(1) + '%';}
const SEVCLASS = {'Level 1':'l1','Level 2':'l2','Level 3':'l3'};

/* RAG scoring from real numbers */
function ragFor(code){
  const c = DATA.countries[code];
  const adh = c.adherence[c.adherence.length-1].pct;
  const breaches = (c.on_time && c.on_time['False']) || 0;
  // Govern: live and integrated -> green for all three live states
  const g = 'g';
  // Risk: exceptions volume + breaches
  let r = 'g';
  if(breaches >= 3 || c.exceptions >= 55) r = 'r';
  else if(breaches >= 2 || c.exceptions >= 50) r = 'a';
  // Compliance: adherence + match rate
  let cp = 'g';
  if(adh < 65 || c.match_pct < 30) cp = 'r';
  else if(adh < 80 || c.match_pct < 38) cp = 'a';
  return {g, r, c:cp};
}

/* ---------- line chart ---------- */
function lineChart(series, months, opts){
  opts = opts||{};
  const w=opts.width||640, h=opts.height||190, pl=34, pr=10, pt=10, pb=22;
  const iw=w-pl-pr, ih=h-pt-pb;
  const yMin=opts.yMin, yMax=opts.yMax, yTicks=opts.yTicks||4;
  const n=months.length;
  const xAt=i=>pl+(i/(n-1))*iw;
  const yAt=v=>pt+ih-((v-yMin)/(yMax-yMin))*ih;
  let grid='';
  for(let i=0;i<=yTicks;i++){
    const y=pt+(i/yTicks)*ih, val=yMax-(i/yTicks)*(yMax-yMin);
    grid+=`<line x1="${pl}" y1="${y}" x2="${w-pr}" y2="${y}" class="chart-grid-line"/>`;
    grid+=`<text x="${pl-6}" y="${y+3}" text-anchor="end" class="chart-axis-label">${Math.round(val)}%</text>`;
  }
  let xlab='';
  months.forEach((m,i)=>{
    if(i%6===0||i===n-1){
      const anchor = i===n-1 ? 'end' : (i===0 ? 'start' : 'middle');
      const x = i===n-1 ? w-pr : (i===0 ? pl : xAt(i));
      xlab+=`<text x="${x}" y="${h-5}" text-anchor="${anchor}" class="chart-axis-label">${m}</text>`;
    }
  });
  let lines='';
  series.forEach(s=>{
    const d=s.points.map((p,i)=>`${i===0?'M':'L'}${xAt(i).toFixed(1)},${yAt(p).toFixed(1)}`).join(' ');
    lines+=`<path d="${d}" class="chart-line" stroke="${s.color}"/>`;
    lines+=`<circle cx="${xAt(n-1).toFixed(1)}" cy="${yAt(s.points[n-1]).toFixed(1)}" r="2.6" fill="${s.color}"/>`;
  });
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}${xlab}${lines}</svg>`;
}
function chartLegend(series){
  return `<div class="chart-legend">${series.map(s=>`<span><span class="chart-legend-swatch" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>`;
}
function adhSeries(codes){
  return codes.map(code=>{
    const a=DATA.countries[code].adherence;
    return {name:code, color:CCOL[code], points:a.map(x=>x.pct)};
  });
}
function adhMonths(code){
  return DATA.countries[code].adherence.map(x=>{
    const d=new Date(x.date); return d.toLocaleString('en-US',{month:'short',day:'numeric'});
  });
}

/* ---------- ranking bars (currency-safe: label carries the unit) ---------- */
function rankBars(items, opts){
  opts=opts||{};
  const max=Math.max(...items.map(i=>i.raw));
  return `<div class="rank-list">${items.map(it=>`
    <div class="rank-item">
      <span class="rank-label">${esc(it.code)}</span>
      <span class="rank-bar-wrap"><span class="rank-bar-fill" style="width:${max?(it.raw/max*100).toFixed(1):0}%;background:${it.color||'var(--navy)'}"></span></span>
      <span class="rank-value">${esc(it.display)}${it.sub?`<div class="rank-sub">${esc(it.sub)}</div>`:''}</span>
    </div>`).join('')}</div>`;
}

/* ---------- recon completeness matrix ---------- */
const STATE_COLS = [
  ['exact_match','Matched'], ['mismatch','Mismatch'], ['missing_in_einvoice','No e-invoice'],
  ['missing_in_gl','No GL'], ['out_of_scope','Out of scope']
];
function reconMatrix(codes){
  const rows = codes.map(code=>{
    const c=DATA.countries[code], t=c.recon_total;
    return {code, cells:STATE_COLS.map(([k])=> (c.recon_state[k]||0)/t*100)};
  });
  return `<table class="heatmap">
    <thead><tr><th class="row"></th>${STATE_COLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="rowlabel">${r.code}</td>${r.cells.map((v,i)=>{
      const isMatch=i===0;
      const style=isMatch?'background:#EAF3EC;color:var(--tp)':(v>=15?'background:#FBF0DA;color:#9A6503':'background:var(--surface);color:var(--ts)');
      return `<td><div class="heat-cell" style="${style}">${v.toFixed(0)}%</div></td>`;
    }).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ---------- stat list ---------- */
function statList(items){
  return `<div class="stat-list">${items.map(s=>`
    <div class="stat-row"><span class="stat-row-label">${s.label}</span>
    <span class="stat-row-value">${esc(s.value)}${s.badge?`<span class="stat-badge ${s.badge}">${esc(s.badgeText)}</span>`:''}</span></div>`).join('')}</div>`;
}

/* ---------- worklist table ---------- */
function worklistTable(items, cur){
  return `<table class="wl-table">
    <thead><tr><th>Document</th><th>Entity</th><th>Finding</th><th class="num">VAT at risk</th></tr></thead>
    <tbody>${items.map(w=>`<tr>
      <td><span class="sev ${SEVCLASS[w.severity]||''}"></span><span class="wl-doc">${esc(w.document_no)}</span><br><span style="font-size:10.5px;color:var(--tm)">${esc(w.side)} · ${esc(w.team)}</span></td>
      <td>${esc(w.entity)}</td>
      <td>${esc(w.finding)}</td>
      <td class="num"><b>${money(cur||w._cur||'', w.vat)}</b></td>
    </tr>`).join('')}</tbody></table>`;
}

/* ============ chrome ============ */
function renderChrome(){
  const scopeOptions=[{v:'portfolio',label:'Portfolio (3 live countries)'},...LIVE.map(c=>({v:c,label:DATA.countries[c].authority+' · '+c}))];
  const tabs = S.scope==='portfolio'
    ? [['overview','Overview'],['compliance','Compliance'],['risk','Risk'],['roadmap','Roadmap']]
    : [['country','Deep dive']];
  document.getElementById('chrome').innerHTML=`
    <div class="chrome">
      <div class="chrome-row">
        <div class="brand">GCC e-invoice command center<small>Sales &amp; purchase reconciliation · run 16 Jul 2026</small></div>
        <div class="chrome-controls">
          <select class="scope-select" onchange="setScope(this.value)">
            ${scopeOptions.map(o=>`<option value="${o.v}" ${S.scope===o.v?'selected':''}>${o.label}</option>`).join('')}
          </select>
          <span class="persona-pill">Group tax</span>
        </div>
      </div>
      <div class="tabbar">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>
    </div>`;
}

/* ============ briefing ============ */
function renderBriefing(){
  const el=document.getElementById('briefing');
  if(S.scope!=='portfolio'||S.tab!=='overview'){el.innerHTML='';return;}
  const K=DATA.countries.KSA, O=DATA.countries.OMN, U=DATA.countries.UAE;
  el.innerHTML=`
    <div class="briefing">
      <div class="briefing-label">Your brief for today · 30 Jul 2026</div>
      <p class="briefing-lead">First full reconciliation pass across all three live GCC jurisdictions is in. <b>The books and the authority feeds do not yet agree.</b> Auto-match sits at ${U.match_pct}% in UAE, ${K.match_pct}% in KSA and ${O.match_pct}% in OMN, so most documents still need a human. KSA carries the largest tax exposure and OMN is the weakest on both matching and on-time issuance.</p>
      <ul class="briefing-list">
        <li>KSA: ${money(K.currency,K.vat_at_risk)} of VAT at risk, the largest of the three. ${K.exceptions} exceptions open, most sitting with tax and compliance.</li>
        <li>OMN: on-time issuance has held near ${O.adherence[O.adherence.length-1].pct}%, the lowest of the three, and ${O.recon_state.missing_in_einvoice} documents have no e-invoice at the authority.</li>
        <li>UAE: cleanest of the three at ${U.match_pct}% matched, but ${U.recon_state.mismatch} value or tax mismatches still need clearing before filing.</li>
        <li>Bahrain, Qatar and Kuwait are not live yet. Readiness ranges from 12% to 42%. See Roadmap.</li>
      </ul>
    </div>`;
}

function tabIntro(lead,sub){return `<div class="tab-intro"><p class="tab-intro-lead">${esc(lead)}</p><p class="tab-intro-sub">${esc(sub)}</p></div>`;}

/* ============ country row ============ */
function renderCountryRow(){
  return `<div class="country-row">${LIVE.map(code=>{
    const c=DATA.countries[code], rag=ragFor(code);
    return `<div class="country-card" onclick="setScope('${code}')">
      <div class="cc-head"><div class="cc-name">${c.jurisdiction.split(' (')[0]}</div><div class="cc-code">${code}</div></div>
      <div class="cc-auth">${esc(c.authority)} · ${esc(c.currency)}</div>
      <div class="cc-rag">
        <div class="cc-rag-item"><span class="cc-rag-letter">G</span><span class="cc-rag-dot ${rag.g}"></span></div>
        <div class="cc-rag-item"><span class="cc-rag-letter">R</span><span class="cc-rag-dot ${rag.r}"></span></div>
        <div class="cc-rag-item"><span class="cc-rag-letter">C</span><span class="cc-rag-dot ${rag.c}"></span></div>
      </div>
      <div class="cc-metrics">
        <div class="cc-metric"><b>${c.match_pct}%</b><span>Matched</span></div>
        <div class="cc-metric"><b>${money(c.currency,c.vat_at_risk)}</b><span>VAT at risk</span></div>
        <div class="cc-metric"><b>${c.exceptions}</b><span>Exceptions</span></div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

/* ============ overview ============ */
function renderOverview(){
  const U=DATA.countries.UAE,K=DATA.countries.KSA,O=DATA.countries.OMN;
  const worstAdh = LIVE.map(c=>({c,v:DATA.countries[c].adherence.slice(-1)[0].pct})).sort((a,b)=>a.v-b.v)[0];
  const sections=[
    {key:'govern',title:'Govern',
      headline:'Three GCC jurisdictions live on one reconciliation. Three more are coming.',
      label:'Coverage', value:'3 live · 3 upcoming',
      note:`UAE on ${U.authority}, KSA on ${K.authority}, OMN on ${O.authority}. Bahrain, Qatar and Kuwait are in scoping at 12% to 42% readiness. Regulatory calendar for the upcoming wave is tracked on Roadmap.`},
    {key:'risk',title:'Risk',
      headline:`KSA holds the largest tax exposure of the three at ${money(K.currency,K.vat_at_risk)}.`,
      label:'Exposure concentration', value:`${money(K.currency,K.vat_at_risk)} in KSA`,
      note:`Each country is shown in its own filing currency, so totals are not summed. Across the three, tax and compliance owns most of the value at risk. ${K.exceptions+O.exceptions+U.exceptions} exceptions open in total.`},
    {key:'compliance',title:'Compliance',
      headline:`Auto-match is low on this first pass. On-time issuance is weakest in OMN at ${worstAdh.v}%.`,
      label:'Match and adherence', value:`${U.match_pct}% / ${K.match_pct}% / ${O.match_pct}% matched`,
      note:`UAE, KSA, OMN respectively. On-time issuance runs ~78% UAE, ~71% KSA, ~62% OMN over the last 30 days. The gap between books and authority is the work in front of us.`},
  ];
  const cards=sections.map(s=>`
    <div class="section">
      <div class="section-eyebrow"><span class="section-mark ${s.key}"></span>${s.title}</div>
      <h2 class="section-headline">${esc(s.headline)}</h2>
      <div class="mcard short">
        <div class="mcard-label">${esc(s.label)}</div>
        <div class="mcard-value">${esc(s.value)}</div>
        <div class="mcard-note">${esc(s.note)}</div>
      </div>
    </div>`).join('');
  return renderCountryRow()+cards+renderLegend();
}

/* ============ compliance tab ============ */
function renderCompliance(){
  const items=LIVE.map(c=>({code:c,raw:DATA.countries[c].match_pct,display:DATA.countries[c].match_pct+'%',color:CCOL[c],
    sub:`${DATA.countries[c].matched}/${DATA.countries[c].documents} docs`}));
  const teamRows=LIVE.map(c=>({code:c,...DATA.countries[c].cnt_by_team}));
  const months=adhMonths('UAE');
  return tabIntro(
    'Auto-match is the share of documents that reconciled cleanly between the ledger and the authority on the first pass. On-time issuance is separate: did the e-invoice reach the authority inside the mandate window.',
    'Everything here is the reconciliation run dated 16 Jul 2026 against 30 days of daily adherence.')+
  `<div class="section" style="margin-top:28px">
    <div class="section-eyebrow"><span class="section-mark compliance"></span>Compliance</div>
    <h2 class="section-headline">Match rates are low across the board on this first pass, and OMN trails on both match and on-time issuance.</h2>
    <p class="section-sub">A low match rate is expected the first time books meet the authority feed. It is a worklist, not a verdict. The real signal is the spread: UAE is roughly ten points ahead of OMN, and OMN's on-time issuance sits near 62%.</p>
    <div class="card-grid">
      <div class="mcard span-2 tall">
        <div class="chart-title-row"><h3 class="chart-title">On-time issuance trend</h3><span class="chart-sub">daily adherence · last 30 days</span></div>
        <p class="chart-headline">UAE holds near 78%, KSA near 71%, OMN near 62%. None is where a live mandate should sit.</p>
        ${lineChart(adhSeries(LIVE), months, {yMin:50,yMax:90,yTicks:4})}
        ${chartLegend(adhSeries(LIVE).map(s=>({name:s.name,color:s.color})))}
      </div>
      <div class="mcard tall">
        <div class="chart-title-row"><h3 class="chart-title">Auto-match rate</h3><span class="chart-sub">matched ÷ documents</span></div>
        <p class="chart-headline">UAE leads, OMN trails by ten points.</p>
        ${rankBars(items)}
      </div>
      <div class="mcard span-2 tall">
        <div class="chart-title-row"><h3 class="chart-title">Where documents land</h3><span class="chart-sub">recon state, share of documents</span></div>
        <p class="chart-headline">Matched sits well under half everywhere. "No e-invoice" is the biggest gap in OMN.</p>
        ${reconMatrix(LIVE)}
        <p class="footnote">Mismatch = value or tax differs. No e-invoice = booked in GL, nothing at the authority. No GL = at the authority, not booked. Out of scope = no obligation.</p>
      </div>
      <div class="mcard gap tall">
        <div class="mcard-label">Root cause of low match</div>
        <span class="mcard-gap-tag">Not tracked yet</span>
        <div class="mcard-note">We can see how many documents failed to match, but not yet whether the driver is buyer TIN quality, timing, tax category, or ERP mapping. Without that split the same exceptions will come back next run.</div>
      </div>
    </div>
  </div>${renderLegend()}`;
}

/* ============ risk tab ============ */
function renderRisk(){
  const excItems=LIVE.map(c=>({code:c,raw:DATA.countries[c].exceptions,display:String(DATA.countries[c].exceptions),color:CCOL[c],
    sub:`${(DATA.countries[c].on_time['False']||0)} late`})).sort((a,b)=>b.raw-a.raw);
  const teamCards=LIVE.map(code=>{
    const c=DATA.countries[code];
    const rows=Object.entries(c.var_by_team).filter(([,v])=>v>0).map(([k,v])=>({label:k,value:money(c.currency,v)}));
    return `<div class="mcard tall">
      <div class="chart-title-row"><h3 class="chart-title">${code} exposure by owner</h3><span class="chart-sub">${c.currency}</span></div>
      <p class="chart-headline">${money(c.currency,c.vat_at_risk)} at risk, ${rows[0]?'led by '+rows[0].label.toLowerCase():''}.</p>
      ${statList(rows)}
    </div>`;
  }).join('');
  return tabIntro(
    'VAT at risk is the tax value on documents that did not reconcile: mismatches, unbooked e-invoices, and unissued invoices that could turn into a penalty or a lost input credit.',
    'Shown in each country’s filing currency. Values are never summed across currencies.')+
  `<div class="section" style="margin-top:28px">
    <div class="section-eyebrow"><span class="section-mark risk"></span>Risk</div>
    <h2 class="section-headline">KSA concentrates the exposure. OMN concentrates the volume.</h2>
    <p class="section-sub">KSA's 15% VAT rate makes each unmatched document expensive, so its value at risk dominates. OMN has the most open exceptions and the most late or unissued invoices, so it is the heaviest operationally.</p>
    <div class="card-grid">
      <div class="mcard tall">
        <div class="chart-title-row"><h3 class="chart-title">Open exceptions</h3><span class="chart-sub">by country</span></div>
        <p class="chart-headline">OMN carries the most items to work.</p>
        ${rankBars(excItems)}
      </div>
      ${teamCards}
      <div class="mcard span-2 tall">
        <div class="chart-title-row"><h3 class="chart-title">Largest single exposures</h3><span class="chart-sub">top 2 documents per country</span></div>
        <p class="chart-headline">A handful of documents carry most of the money. Start here.</p>
        ${worklistTable(topPerCountry(2), '')}
        <p class="footnote">Grouped by country so currencies are never ranked against each other. Amounts are each document’s own filing currency. Dot colour is severity: green L1, amber L2, red L3.</p>
      </div>
      <div class="mcard gap tall">
        <div class="mcard-label">Penalty and deadline clock</div>
        <span class="mcard-gap-tag">Not tracked yet</span>
        <div class="mcard-note">We show value at risk, but not time to breach. ZATCA clearance and OTA reporting both run against a clock, and the run index does not yet carry per-document deadlines. That timer is the next thing to wire in.</div>
      </div>
    </div>
  </div>${renderLegend()}`;
}

function topPerCountry(n){
  // Top n by VAT at risk within each country, then concatenated in country order.
  // Never ranks one currency against another.
  const out=[];
  LIVE.forEach(code=>{
    const cur=DATA.countries[code].currency;
    DATA.countries[code].worklist_top.slice(0,n).forEach(w=>out.push({...w, _cur:cur}));
  });
  return out;
}

/* ============ roadmap tab ============ */
function renderRoadmap(){
  const reg=DATA.registry;
  const cov = reg.live.map(c=>({name:c.name, sub:c.authority, cells:['live','live','live']}))
    .concat(reg.upcoming.map(c=>({name:c.name, sub:(c.expected_go_live||'TBC'), cells:['plan','plan','plan']})));
  const covHtml=`<table class="cov-matrix">
    <thead><tr><th class="row"></th><th>Sales</th><th>Purchase</th><th>Authority feed</th></tr></thead>
    <tbody>${cov.map(r=>`<tr><td class="rowlabel">${esc(r.name)}<small>${esc(r.sub)}</small></td>${r.cells.map(c=>`<td><span class="cov-symbol ${c}"></span></td>`).join('')}</tr>`).join('')}</tbody>
  </table>
  <div class="chart-legend" style="margin-top:12px"><span><span class="cov-symbol live"></span> Live</span><span><span class="cov-symbol plan"></span> Planned</span></div>`;

  const readyCards=reg.upcoming.map(c=>{
    const items=(c.readiness||[]).map(it=>{
      const cls={'Done':'done','In progress':'prog','Monitoring':'mon','Not started':'no'}[it.status]||'no';
      return `<div class="ready-item"><span><span class="ready-dot ${cls}"></span>${esc(it.item)}</span><span style="color:var(--tm);font-size:11px">${esc(it.status)}</span></div>`;
    }).join('');
    return `<div class="mcard tall">
      <div class="chart-title-row"><h3 class="chart-title">${esc(c.name)}</h3><span class="chart-sub">${esc(c.authority)}</span></div>
      <div class="ready-pct-wrap"><div class="ready-pct-fill" style="width:${c.readiness_pct||0}%"></div></div>
      <p class="chart-headline" style="margin-top:4px">${c.readiness_pct||0}% ready · ${esc(c.next_milestone||'')}</p>
      <p class="mcard-note" style="margin-top:0">${esc(c.note||'')}</p>
      <div class="ready-track">${items}</div>
    </div>`;
  }).join('');

  return tabIntro(
    'The GCC e-invoice wave is not finished. Three jurisdictions are live and reconciling. Three more are in build, and the readiness tracker below is how we avoid a scramble when each mandate date lands.',
    'Live coverage on the left, upcoming jurisdictions with their readiness checklist on the right.')+
  `<div class="section" style="margin-top:28px">
    <div class="section-eyebrow"><span class="section-mark govern"></span>Roadmap</div>
    <h2 class="section-headline">Three live, three coming. Qatar is furthest along at 42%, Kuwait barely started at 12%.</h2>
    <p class="section-sub">Bahrain, Qatar and Kuwait all sit behind confirmed mandates or draft law. The common gaps are the same everywhere: accreditation path, GL integration and master data. Getting those moving now is cheaper than at go-live.</p>
    <div class="card-grid">
      <div class="mcard span-2 tall">
        <div class="chart-title-row"><h3 class="chart-title">GCC coverage</h3><span class="chart-sub">6 jurisdictions</span></div>
        <p class="chart-headline">Every live country reconciles both sides. Nothing is wired for the upcoming three yet.</p>
        ${covHtml}
      </div>
      <div class="mcard tall">
        <div class="chart-title-row"><h3 class="chart-title">Readiness at a glance</h3></div>
        <p class="chart-headline">Qatar leads the upcoming wave; Kuwait has no firm date.</p>
        ${rankBars(reg.upcoming.map(c=>({code:c.code,raw:c.readiness_pct||0,display:(c.readiness_pct||0)+'%',color:'var(--c-up)',sub:c.expected_go_live})))}
      </div>
    </div>
    <div class="card-grid" style="margin-top:16px">${readyCards}</div>
  </div>${renderLegend()}`;
}

/* ============ country deep dive ============ */
function renderCountry(){
  const code=S.scope, c=DATA.countries[code], reg=DATA.registry.live.find(x=>x.code===code)||{};
  const lateN=c.on_time['False']||0;
  const kpis=[
    {label:'Documents', value:c.documents, note:`${c.sales.documents} sales · ${c.purchase.documents} purchase`},
    {label:'Auto-matched', value:c.match_pct+'%', note:`${c.matched} of ${c.documents} documents`},
    {label:'VAT at risk', value:money(c.currency,c.vat_at_risk), note:`${c.exceptions} exceptions open`},
    {label:'On-time issuance', value:c.adherence.slice(-1)[0].pct+'%', note:`${lateN} document${lateN===1?'':'s'} flagged late`},
  ];
  const entRows=c.entities.map(e=>({
    label:`<b>${esc(e.entity_id)}</b> ${esc(e.entity_name)} <span style="color:var(--tm)">· ${esc(e.side)} · ${esc(e.source)}</span>`,
    value:`${e.match_pct}% · ${money(c.currency,e.vat_at_risk)}`,
  }));
  const months=adhMonths(code);
  return `<span class="back-link" onclick="setScope('portfolio')">← Portfolio</span>
    <div class="section-eyebrow"><span class="section-mark compliance"></span>${esc(reg.name||code)} · ${esc(c.authority)}</div>
    <h2 class="section-headline" style="margin-bottom:4px">${esc(reg.model||c.jurisdiction)}</h2>
    <p class="section-sub">${esc(reg.on_time_rule?('On-time rule: '+reg.on_time_rule+'.'):'')} VAT rate ${reg.vat_rate!=null?(reg.vat_rate*100)+'%':'n/a'}. Filing currency ${esc(c.currency)}.</p>
    <div class="kpi-row">${kpis.map(k=>`<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-value">${esc(k.value)}</div><div class="kpi-note">${esc(k.note)}</div></div>`).join('')}</div>
    <div class="card-grid">
      <div class="mcard span-2 tall">
        <div class="chart-title-row"><h3 class="chart-title">On-time issuance trend</h3><span class="chart-sub">last 30 days</span></div>
        <p class="chart-headline">${trendHeadline(code)}</p>
        ${lineChart([{name:code,color:CCOL[code],points:c.adherence.map(x=>x.pct)}], months, {yMin:50,yMax:90,yTicks:4})}
      </div>
      <div class="mcard tall">
        <div class="chart-title-row"><h3 class="chart-title">Recon state</h3><span class="chart-sub">${c.recon_total} documents</span></div>
        <p class="chart-headline">Matched vs the gaps that need work.</p>
        ${reconMatrix([code])}
      </div>
      <div class="mcard span-2 tall">
        <div class="chart-title-row"><h3 class="chart-title">Largest exposures</h3><span class="chart-sub">top documents by VAT at risk</span></div>
        <p class="chart-headline">Where the money and the risk concentrate.</p>
        ${worklistTable(c.worklist_top.slice(0,8), c.currency)}
      </div>
      <div class="mcard tall">
        <div class="chart-title-row"><h3 class="chart-title">Entities in this run</h3><span class="chart-sub">match % · VAT at risk</span></div>
        <p class="chart-headline">Per legal entity and ERP source.</p>
        ${statList(entRows)}
      </div>
    </div>${renderLegend()}`;
}
function trendHeadline(code){
  const a=DATA.countries[code].adherence, first=a[0].pct, last=a[a.length-1].pct;
  const delta=(last-first).toFixed(1);
  if(Math.abs(last-first)<1.5) return `Roughly flat this month, holding near ${last}%.`;
  return last>first?`Up ${delta} points to ${last}% this month.`:`Down ${Math.abs(delta)} points to ${last}% this month.`;
}

/* ============ legend ============ */
function renderLegend(){
  return `<div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:var(--govern)"></span>Govern: coverage and setup</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--risk)"></span>Risk: tax exposure</div>
    <div class="legend-item"><span class="legend-swatch" style="background:var(--compliance)"></span>Compliance: current execution</div>
    <div class="legend-item"><span class="legend-dashed"></span>Not tracked yet, needs a metric</div>
  </div>`;
}

/* ============ router ============ */
function renderMain(){
  const el=document.getElementById('main');
  if(S.scope!=='portfolio'){el.innerHTML=renderCountry();return;}
  if(S.tab==='overview') el.innerHTML=renderOverview();
  else if(S.tab==='compliance') el.innerHTML=renderCompliance();
  else if(S.tab==='risk') el.innerHTML=renderRisk();
  else if(S.tab==='roadmap') el.innerHTML=renderRoadmap();
}
function renderAll(){renderChrome();renderBriefing();renderMain();window.scrollTo(0,0);}
function setTab(t){S.tab=t;renderAll();}
function setScope(s){S.scope=s; S.tab = s==='portfolio'?'overview':'country'; renderAll();}
renderAll();
</script>
</body>
</html>
